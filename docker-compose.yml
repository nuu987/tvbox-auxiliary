services:
  tvbox:
    image: ghcr.io/nuu987/tvbox-auxiliary:latest
    container_name: tvbox_auxiliary
    ports:
      - "25678:25678"
    volumes:
      - ./data:/app/data
    environment:
      - ADMIN_TOKEN=tvboxauxiliarydevadministration
      #
      # See .env.example for detail.
      #
      # - BASE_URL=
      # - CRON_SCHEDULE=0 5 * * *
      - MAX_DATA_SOURCES=${MAX_DATA_SOURCES:-6}
      - SITE_TIMEOUT_MS=${SITE_TIMEOUT_MS:-3000}
      - FETCH_TIMEOUT_MS=${FETCH_TIMEOUT_MS:-15000}
    restart: unless-stopped
